name: Update playlists

on:
  schedule:
    - cron: "17 0 * * *"   # every day, 05:47 India time
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update.py
      - name: Save changes
        run: |
          git config user.name "hansonds"
          git config user.email "hanson.in@outlook.com"
          git add *.m3u
          git diff --cached --quiet || git commit -m "Update playlist links"
          git push
